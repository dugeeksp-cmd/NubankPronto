    <!-- 3. Service Worker Inline Script with Offline Caching & Blob URL Fallback -->
    <script>
      (function() {
        // Capture PWA beforeinstallprompt globally
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
        });

        window.addEventListener('appinstalled', function() {
          window.deferredPWAInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: './' })
              .then(function(reg) {
                console.log('Nu RPG PWA Service Worker registrado com sucesso:', reg.scope);
              })
              .catch(function(err) {
                console.warn('Registro de /sw.js falhou, utilizando Service Worker inline via Blob URL...', err);
                
                var swInlineCode = `
                  const CACHE_NAME = 'nurpg-pwa-blob-v2';
                  const ASSETS = [
                    './',
                    './index.html',
                    'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'
                  ];

                  self.addEventListener('install', (e) => {
                    e.waitUntil(
                      caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS).catch(() => {}))
                    );
                    self.skipWaiting();
                  });

                  self.addEventListener('activate', (e) => {
                    e.waitUntil(
                      caches.keys().then((keys) => Promise.all(
                        keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))
                      ))
                    );
                    self.clients.claim();
                  });

                  self.addEventListener('fetch', (e) => {
                    if (e.request.method !== 'GET') return;
                    e.respondWith(
                      caches.match(e.request).then((res) => {
                        return res || fetch(e.request).then((netRes) => {
                          if (netRes && netRes.status === 200) {
                            const clone = netRes.clone();
                            caches.open(CACHE_NAME).then((c) => c.put(e.request, clone));
                          }
                          return netRes;
                        }).catch(() => {
                          if (e.request.mode === 'navigate') {
                            return caches.match('./') || caches.match('./index.html');
                          }
                        });
                      })
                    );
                  });
                `;

                try {
                  var blob = new Blob([swInlineCode], { type: 'application/javascript' });
                  var blobUrl = URL.createObjectURL(blob);
                  navigator.serviceWorker.register(blobUrl, { scope: './' })
                    .then(function(bReg) {
                      console.log('Nu RPG PWA Blob Service Worker ativo:', bReg.scope);
                    })
                    .catch(function(bErr) {
                      console.warn('Nu RPG PWA Service Worker não suportado nesta origem:', bErr);
                    });
                } catch(e) {
                  console.warn('Erro ao criar Blob Service Worker:', e);
                }
              });
          });
        }
      })();
    </script>
